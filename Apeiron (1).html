<style>
:root{--bg:#F5F7F6;--card:#fff;--ink:#10201C;--mut:#4A5B56;--ac:#0F6B5C;--soft:#E3EEEA;--line:#C9D6D1;--dk:#10201C;--dkt:#F5F7F6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1715;--card:#14231F;--ink:#EAF1EE;--mut:#A9BAB4;--ac:#5CC4AE;--soft:#122A25;--line:#2A423B;--dk:#06100E;--dkt:#EAF1EE}}
:root[data-theme="dark"]{--bg:#0D1715;--card:#14231F;--ink:#EAF1EE;--mut:#A9BAB4;--ac:#5CC4AE;--soft:#122A25;--line:#2A423B;--dk:#06100E;--dkt:#EAF1EE}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Sora',system-ui,sans-serif;margin:0}
a{color:var(--ac)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:22px;background:none;border:0;color:var(--ink)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;font-weight:600}
nav button.on{background:var(--soft);color:var(--ac)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;padding:7px 12px;color:var(--mut);font-weight:600}
.lang button.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:40px 20px 72px}
.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:600;color:var(--ac)}
h1{font-size:clamp(32px,6vw,52px);line-height:1.12;margin:12px 0 16px;max-width:780px}
h2{font-size:clamp(24px,4vw,34px);margin:0 0 8px}
.lead{color:var(--mut);max-width:640px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h3{font-size:19px;margin-bottom:8px}
.card p{margin:0 0 10px;color:var(--mut)}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:600;text-decoration:none}
.btn.o{background:none;border:2px solid var(--ac);color:var(--ac);padding:9px 18px}
.tag{display:inline-block;font-size:13px;font-weight:600;background:var(--soft);color:var(--ac);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.note{font-size:14px;color:var(--mut)}
.band{background:var(--dk);color:var(--dkt);border-radius:14px;padding:28px;margin:28px 0}
.band p{color:inherit;opacity:.85;margin:6px 0 0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
label{display:block;font-weight:600;margin:14px 0 6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bar2{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:220px;max-height:55vh;overflow-y:auto;margin-bottom:12px}
.m{margin:0 0 12px;padding:10px 14px;border-radius:10px;white-space:pre-wrap}
.m.u{background:var(--soft);margin-left:12%}
.m.a{border:1px solid var(--line);margin-right:12%}
ul{padding-left:20px;margin:6px 0}
li{margin:4px 0}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;font-size:14px;color:var(--mut)}
.warn{border-left:4px solid var(--ac);background:var(--soft);padding:14px 18px;border-radius:8px;margin:20px 0}
</style>
</head>

if(view==='assistant')renderChat();
}
function home(){return '<div class="eyebrow">ἄπειρον · '+esc(T('tag')).toUpperCase()+'</div><h1>'+esc(T('h'))+'</h1><p class="lead">'+esc(T('hd'))+'</p>'
+'<div class="grid">'+[['science','sciD'],['art','artD'],['migration','migD'],['support','supD']].map(function(p){return '<div class="card"><h3>'+T('nav')[p[0]]+'</h3><p>'+esc(T(p[1]))+'</p><button class="btn o" onclick="go(\''+p[0]+'\')">'+T('explore')+'</button></div>'}).join('')+'</div>'
+'<div class="band"><h2>'+T('nav').assistant+'</h2><p>'+esc(T('asP'))+'</p><p><button class="btn" onclick="go(\'assistant\')">'+T('explore')+'</button></p></div>'}
function section(s){
var fs=F[s],h='<h2>'+T('nav')[s]+'</h2><p class="lead">'+esc(T(s==='science'?'sciD':'artD'))+'</p>';
h+='<div class="chips"><button class="'+(field===''?'on':'')+'" onclick="go(\''+s+'\')">'+T('all')+'</button>'+fs.map(function(f){return '<button class="'+(field===f.id?'on':'')+'" onclick="go(\''+s+'\',\''+f.id+'\')">'+esc(L(f.n))+'</button>'}).join('')+'</div>';
if(field)h+='<div class="card"><span class="tag">AI</span><p>'+esc(T('vid'))+'</p></div>';
h+='<div class="grid">'+W.filter(function(w){return w.s===s&&(!field||w.f===field)}).map(function(w){return '<div class="card"><span class="tag">'+esc(L(fs.filter(function(f){return f.id===w.f})[0].n))+'</span><h3>'+esc(L(w.t))+'</h3><p>'+esc(w.a)+' · '+esc(w.y)+'</p><p>'+esc(L(w.tp))+'</p><button class="btn o" onclick="go(\'work\',\''+s+'\',\''+w.id+'\')">'+T('explore')+'</button></div>'}).join('')+'</div>';
h+='<h2 style="margin-top:36px">'+T('meet')+'</h2><div class="grid">'+M.filter(function(m){return m.s===s}).map(function(m){var n=m.n+(joined[m.id]?1:0),pc=Math.min(100,Math.round(n/m.min*100));return '<div class="card"><h3>'+esc(L(m.t))+'</h3><div class="bar2"><i style="width:'+pc+'%"></i></div><p>'+n+' '+T('of')+' '+m.min+' ('+T('min')+') · '+T('price')+': '+m.p+' AZN</p><button class="btn'+(joined[m.id]?' o':'')+'" onclick="joined[\''+m.id+'\']=!joined[\''+m.id+'\'];render()">'+(joined[m.id]?T('reserved'):T('reserve'))+'</button><p class="note" style="margin-top:10px">'+esc(T('sample'))+'</p></div>'}).join('')+'</div>';
return h}
function workPage(){var w=W.filter(function(x){return x.id===work})[0];return '<p><button class="btn o" onclick="go(\''+w.s+'\',\''+w.f+'\')">← '+T('back')+'</button></p><span class="tag">'+T(w.s==='art'?'artist':'by')+': '+esc(w.a)+'</span><h1 style="font-size:clamp(28px,5vw,42px)">'+esc(L(w.t))+'</h1><p class="note">'+esc(w.y)+'</p><div class="card"><h3>'+T('topic')+'</h3><p>'+esc(L(w.tp))+'</p><h3>'+T('story')+'</h3><p>'+esc(L(w.st))+'</p></div><div class="warn">'+esc(T('tr'))+'</div><p><a class="btn" target="_blank" rel="sponsored noopener" href="https://openlibrary.org/search?q='+encodeURIComponent(w.q)+'">'+T('buy')+'</a></p><p class="note">'+esc(T('aff'))+'</p>'}
function migration(){
var c=C.filter(function(x){return x.id===country})[0],p=P[purpose];
var h='<h2>'+T('nav').migration+'</h2><p class="lead">'+esc(T('migD'))+'</p><div class="row"><div><label for="cs">'+T('country')+'</label><select id="cs" onchange="country=this.value;render()">'+C.map(function(x){return '<option value="'+x.id+'"'+(x.id===country?' selected':'')+'>'+esc(L(x.n))+'</option>'}).join('')+'</select></div>'
+'<div><label for="ps">'+T('purp')+'</label><select id="ps" onchange="purpose=this.value;render()">'+[['work','work_'],['study','study'],['tourism','tour']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]===purpose?' selected':'')+'>'+T(x[1])+'</option>'}).join('')+'</select></div></div>';
h+='<div class="card" style="margin-top:20px"><h3>'+esc(L(c.n))+'</h3><p>'+esc(L(c.cu))+'</p><a class="btn o" target="_blank" rel="noopener" href="https://earth.google.com/web/search/'+encodeURIComponent(c.earth)+'">'+T('earth')+'</a> <a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+encodeURIComponent(c.earth)+'">'+T('maps')+'</a></div>';
h+='<div class="grid"><div class="card"><h3>'+T('req')+'</h3>'+li(L(p.req))+'</div><div class="card"><h3>'+T('docs')+'</h3>'+li(L(p.doc))+'</div><div class="card"><h3>'+T('steps')+'</h3><ol style="padding-left:20px;margin:6px 0">'+L(p.stp).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div></div>';
if(p.q){var q=L(p.q);h+='<div class="card"><h3>'+T('iv')+'</h3><p><b>'+esc(q[0])+'</b></p><p>'+esc(q[1])+'</p></div>'}
var link=purpose==='work'?c.w:purpose==='study'?c.s:'https://www.google.com/travel/explore';
h+='<p style="margin-top:20px"><a class="btn" target="_blank" rel="'+(purpose==='tourism'?'sponsored ':'')+'noopener" href="'+link+'">'+(purpose==='tourism'?T('explore'):T('off'))+'</a></p><p class="note">'+esc(T('verify'))+(purpose==='tourism'?' '+esc(T('aff')):'')+'</p>';
return h}
function support(){
var h='<h2>'+T('supH')+'</h2><p class="lead">'+esc(T('supP'))+'</p><div class="warn">'+esc(T('safe'))+'</div>';
h+='<div class="card"><div class="row"><div><label for="sa">'+T('age')+'</label><input id="sa" type="number" min="10" max="100"></div><div><label for="se">'+T('edu')+'</label><select id="se">'+T('edus').map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div></div><label for="sf">'+T('feel')+'</label><select id="sf">'+T('feels').map(function(x,i){return '<option value="'+i+'">'+esc(x)+'</option>'}).join('')+'</select><label for="sg">'+T('goal')+'</label><input id="sg" type="text"><p style="margin-top:16px"><button class="btn" onclick="makePlan()">'+T('make')+'</button></p></div>';
if(plan){h+='<h2 style="margin-top:32px">'+T('planT')+'</h2><div class="grid">'+(plan.f==='0'?'<div class="card"><span class="tag">1</span><h3>'+T('psy')+'</h3><p>'+esc(T('psyT'))+'</p><button class="btn o" onclick="go(\'assistant\')">'+T('explore')+'</button></div>':'')+'<div class="card"><h3>'+T('learn')+(plan.g?': '+esc(plan.g):'')+'</h3><p>'+esc(T('learnT'))+'</p></div><div class="card"><h3>'+T('fam')+'</h3><p>'+esc(T('famT'))+'</p></div><div class="card"><h3>'+T('car')+'</h3><p>'+esc(T('carT'))+'</p></div></div>'}
h+='<div class="band"><h2>'+T('co')+'</h2><p>'+esc(T('coT'))+'</p></div>';
return h}
function makePlan(){plan={f:document.getElementById('sf').value,g:document.getElementById('sg').value.trim().slice(0,80)};render()}
function assistant(){
return '<h2>'+T('asH')+'</h2><p class="lead">'+esc(T('asP'))+'</p><div class="chips">'+T('sug').map(function(s,i){return '<button onclick="ask(U[lang].sug['+i+'])">'+esc(s)+'</button>'}).join('')+'</div><div class="chat" id="chat" aria-live="polite"></div><div style="display:flex;gap:10px"><textarea id="q" rows="2" placeholder="'+esc(T('ph'))+'" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();ask()}"></textarea><button class="btn" onclick="ask()">'+T('send')+'</button></div><p class="note">'+esc(T('aiNote'))+'</p>'}
function renderChat(){var c=document.getElementById('chat');if(!c)return;c.innerHTML='';chatLog.forEach(function(m){var d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');d.textContent=m.content;c.appendChild(d)});c.scrollTop=c.scrollHeight}
async function ask(txt){
var el=document.getElementById('q'),text=(txt||(el&&el.value)||'').trim();if(!text||busy)return;if(el)el.value='';
if(!sampleFn){try{var s=await claude.use('sample');if(s)sampleFn=s}catch(e){}}
chatLog.push({role:'user',content:text});
if(!sampleFn){chatLog.push({role:'assistant',content:T('nai')});renderChat();return}
var a={role:'assistant',content:'…'};chatLog.push(a);renderChat();busy=true;
var sys='You are the assistant of Apeiron, a platform for science, art, migration and personal support. Reply only in '+(lang==='az'?'Azerbaijani':'English')+'. Be clear, honest about uncertainty and concise. You are not a lawyer, doctor or therapist; for migration say to verify on official sources; if the user mentions self-harm, suicide or abuse, respond with calm support and encourage contacting local emergency services or a crisis line and someone they trust.\n\n';
var msgs=chatLog.slice(0,-1).filter(function(m){return m.content!==T('err')&&m.content!==T('nai')}).slice(-10).map(function(m){return{role:m.role,content:m.content}});
while(msgs.length&&msgs[0].role!=='user')msgs.shift();
msgs[0].content=sys+msgs[0].content;
try{await sampleFn(msgs,{cache:false,onText:function(x){a.content=x.text;renderChat()}})}catch(e){a.content=T('err');renderChat()}
busy=false}
render();
</script>
